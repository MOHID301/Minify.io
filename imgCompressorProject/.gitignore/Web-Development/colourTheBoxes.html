<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            height: 100%;
            width: 100%;
        }
        nav{
            display: flex;
            align-items: center;
            justify-content: center;
        }
        div{
            margin: 20px;
            height: 30px;
            width: 30px;
            border: 2px solid black;
        }
    </style>
    
</head>
<body>
    <nav>
        <div class="box1"></div>
        <div class="box2"></div>
        <div class="box3"></div>
        <div class="box4"></div>
    </nav>
    <script>
        document.getElementsByTagName("div")[1].style.background = "red"
        document.getElementsByClassName("box1")[0].style.background = "blue"
        document.getElementsByClassName("box2")[0].style.borderRadius = "50%";
    


    </script>
</body>
</html>
