<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .parent{
            text-align: center;
            background-color: mediumspringgreen;
            margin: 14px;
            padding: 14px;

        }
        .child{
            background-color: yellowgreen;
            margin: 14px;
            padding: 14px;
            
        }
        .subchild{
            background-color: seagreen;
            margin: 14px;
            padding: 14px;
            
        }
    </style>
</head>
<body>
    <div class="parent">
        this is parent
        <div class="child">
            this is child
            <div class="subchild">
                this is sub-child
            </div>
        </div>
    </div>
    <script>
        
        let parent = document.querySelector(".parent")
        parent.addEventListener("click", ()=>{
            parent.style.background = "black"
        })
        let child = document.querySelector(".child")
            
        child.addEventListener("click", (e)=>{
            e.stopPropagation()
            child.style.background = "pink"
        
        })
            let subchild = document.querySelector(".subchild" , )
            subchild.addEventListener("click", (e)=>{
            e.stopImmediatePropagation()
            subchild.style.background = "teal"
        })

        setTimeout(() => {
            document.querySelector(".subchild").style.background = "teal"
        }, 9000);

        setInterval(() => {
            document.querySelector(".subchild").style.background = "red"
        }, 2000);
        
        
    </script>
</body>
</html>
